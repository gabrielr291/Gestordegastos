<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración - Finanzas Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto flex justify-between items-center gap-2">
      <h1 class="text-base sm:text-lg font-bold truncate">
        <i class="fa-solid fa-user-shield text-blue-500 mr-2"></i>Panel Administrador
      </h1>
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-xs text-slate-400 hover:text-white transition whitespace-nowrap">Volver a App</a>
        <button id="btn-logout-admin" class="px-3 py-1.5 bg-rose-600 text-xs font-bold rounded-lg hover:bg-rose-700 transition whitespace-nowrap">
          Cerrar Sesión
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 sm:p-6">
    <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-xl">
      <div class="p-4 border-b border-slate-700">
        <h2 class="text-sm font-bold">Gestión de Usuarios Registrados</h2>
      </div>
      <!-- Contenedor con scroll horizontal para pantallas pequeñas -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs min-w-[650px]">
          <thead class="bg-slate-900 text-slate-400 uppercase font-semibold">
            <tr>
              <th class="p-3">Usuario / Email</th>
              <th class="p-3">Rol</th>
              <th class="p-3">Estado</th>
              <th class="p-3 text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-usuarios" class="divide-y divide-slate-700/50"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
