<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Finanzas Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
    <div class="text-center mb-6">
      <i class="fa-solid fa-wallet text-4xl text-blue-500 mb-2"></i>
      <h2 class="text-2xl font-bold">Finanzas Pro</h2>
      <p class="text-xs text-slate-400">Gestión financiera personal</p>
    </div>

    <div class="flex border-b border-slate-700 mb-6">
      <button id="tab-login" class="w-1/2 py-2 text-sm font-bold border-b-2 border-blue-500 text-blue-500">Iniciar Sesión</button>
      <button id="tab-register" class="w-1/2 py-2 text-sm font-bold border-b-2 border-transparent text-slate-400">Registrarse</button>
    </div>

    <div id="error-msg" class="hidden bg-rose-500/10 border border-rose-500 text-rose-400 text-xs p-3 rounded-xl mb-4"></div>

    <form id="form-login" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Correo Electrónico</label>
        <input type="email" id="login-email" required class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Contraseña</label>
        <input type="password" id="login-password" required class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
      </div>
      <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl transition">Ingresar</button>
    </form>

    <form id="form-register" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Nombre Completo</label>
        <input type="text" id="reg-name" required class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Correo Electrónico</label>
        <input type="email" id="reg-email" required class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Contraseña (Mín. 8 carácteres, números y símbolos)</label>
        <input type="password" id="reg-password" required class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Repetir Contraseña</label>
        <input type="password" id="reg-password-confirm" required class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
      </div>
      <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl transition">Crear Cuenta</button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
